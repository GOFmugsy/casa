---
- name: Update and upgrade apt packages
  become: true
  become_method: sudo
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400 #One day

- name: Install packages to common
  become: true
  become_method: sudo
  apt:
    pkg:
      - vim
      - bc
      - ansible
      - apt-transport-https
      - ca-certificates
      - curl
      - expect
      - git
      - software-properties-common
      - python3-pip
      - virtualenv
      - python3-setuptools
      - gnupg-agent
      - aptitude
      - nfs-common
    state: latest

- name: Remove apt-managed docker
  become: true
  become_method: sudo
  apt:
    pkg:
      - docker.io
      - docker-compose
    state: absent

- name: Create Docker GPG key directory
  become: true
  become_method: sudo
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  become: true
  become_method: sudo
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository to Apt sources
  become: true
  become_method: sudo
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Update apt cache after adding Docker repository
  become: true
  become_method: sudo
  ansible.builtin.apt:
    update_cache: yes

- name: Install Docker and Docker Compose
  become: true
  become_method: sudo
  ansible.builtin.package:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Ensure Docker service is enabled and started
  become: true
  become_method: sudo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Ignore PEP 668 because it's silly.
  become: true
  become_method: sudo
  ansible.builtin.file:
    path: /usr/lib/python3.11/EXTERNALLY-MANAGED
    state: absent

- name: Install pip packages to all
  ansible.builtin.pip:
    name:
      - jsondiff

- name: Add docker group
  become: true
  become_method: sudo
  group:
    name: "docker"
    state: present

- name: Add mugsy to docker group
  become: true
  become_method: sudo
  user:
    name: mugsy
    groups: docker
    append: yes

- name: copy docker daemon config to hosts
  become: true
  become_method: sudo
  ansible.builtin.copy:
    src: roles/common/configs/daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'

- name: Ensure docker is running and enabled at boot
  become: true
  become_method: sudo
  systemd:
    name: "docker.service"
    state: started
    enabled: true

- name: Ensure containerd is running and enabled at boot
  become: true
  become_method: sudo
  systemd:
    name: "containerd.service"
    state: started
    enabled: true

- name: Check if public key exists
  stat:
    path: "~/.ssh/id_rsa.pub"
  register: pubkey

- name: Create public private keypair
  community.crypto.openssh_keypair:
    path: ~/.ssh/id_rsa
  when: not pubkey.stat.exists

- name: Add ssh trusts
  authorized_key:
    user: "mugsy"
    state: present
    key: "{{ vozdukh_pub }}"
